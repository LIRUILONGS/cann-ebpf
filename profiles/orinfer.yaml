apiVersion: cann-ebpf/v1
kind: Profile
metadata:
  name: orinfer

spec:
  extends: ../configs/base.yaml

  match:
    priority: 100
    # Orinfer 容器镜像可能也是 vllm-ascend，不能按镜像名判断。
    # 必须同时满足 Orinfer 自身标记 + libascendcl 映射；没有运行时不应命中 V4 worker。
    any:
      - comm: orinfer
      - cmdline_contains: orinfer
      - cmdline_contains: start-orinfer.sh
      - container_name: orinfer-cann920
    all:
      - maps_contains: libascendcl.so

  target:
    selector: first_match
    max_processes: 16
    process_tree: true
    include_children: true
    discovery_window_ms: 15000
    proc_root: /proc/{pid}/root

  cann:
    version: "9.2.0"
    launch_layer: auto
    # H1：真正阻塞 host 的同步调用。
    symbol_overrides:
      sync:
        - aclrtSynchronizeStream
        - aclrtSynchronizeStreamWithTimeout
        - aclrtSynchronizeEvent
      # H2：event 依赖/轮询。
      event:
        - aclrtRecordEvent
        - aclrtStreamWaitEvent
        - aclrtQueryEventStatus
        - aclrtQueryEventWaitStatus
        - aclrtQueryEvent
      # M/关联键：device、stream、event 生命周期。
      handle:
        - aclrtSetDevice
        - aclrtGetDevice
        - aclrtSetCurrentContext
        - aclrtCreateStream
        - aclrtDestroyStream
        - aclrtCreateEvent
        - aclrtCreateEventWithFlag
        - aclrtResetEvent
        - aclrtDestroyEvent
      memory:
        - aclrtMalloc
        - aclrtFree
        - aclrtMallocHost
        - aclrtFreeHost
        - aclrtHostRegister
        - aclrtHostUnregister
        - aclrtGetMemInfo
        - rtMemGetInfoEx
      # H2：异步提交，入口延迟不是设备执行时长。
      submit:
        - aclrtMemcpyAsync
        - aclrtLaunchKernel
        - rtKernelLaunch
        - rtKernelLaunchWithFlagV2
        - rtMemcpyAsync
      # C：HCCL host 入队；设备侧 activity 需要 M3 的 msPTI。
      hccl:
        - HcclAllReduce
        - HcclAlltoAll
        - HcclAllGather
        - HcclReduceScatter
        - HcclBroadcast
        - HcclSend
        - HcclRecv

  probes:
    sync:
      enabled: true
      mode: full
      min_duration_us: 1000
    event:
      enabled: true
      mode: aggregate
      min_duration_us: 1000
    memory:
      enabled: true
      mode: full
      min_duration_us: 500
    submit:
      enabled: true
      mode: sample
      sample_rate: 64
      min_duration_us: 500
    hccl:
      enabled: auto
      mode: sample
      sample_rate: 16
      min_duration_us: 1000
    sched:
      enabled: true
      mode: aggregate
    futex:
      enabled: true
      mode: aggregate
    ioctl:
      enabled: false
      mode: aggregate

  context:
    mode: tid
    batch: auto
    attribution_level: auto
    notes: "Orinfer 当前没有稳定 request hook，先用 tid/时间窗；拿到入口符号后再升级"

  mspti:
    # 保留 M0/M3 的设备侧配置；M1 tracefs attach 用 --only sync,memory,handle
    # 限定 host 探针。M3 启用前必须按 /proc/<pid>/root 重新解析库路径。
    mode: exclusive
    library: /usr/local/Ascend/cann-9.2.0/aarch64-linux/lib64/libmspti.so
    headers: /usr/local/Ascend/cann-9.2.0/tools/mspti/include
    activity:
      - API
      - KERNEL
      - MEMCPY
      - HCCL

  notes:
    - "Orinfer 运行在长容器 orinfer-cann920 中，host network，端口 8000"
    - "listen_port=8000 只作为人工提示，不作为单独匹配条件，避免误 attach 其他 8000 服务"
    - "容器镜像虽然是 vllm-ascend，但运行时是 Orinfer；禁止按镜像名判断框架"
    - "未运行时 discover 必须返回 no matching process，不能命中 V4 的 Worker_TP/EngineCore"
    - "selector=first_match 只选主进程；process_tree/include_children 由 attach 覆盖其子进程"
    - "M1/M2 不允许重启服务；只 attach 已存在的 PID"
