name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags "-s -w" \
            -o dist/cann-ebpf-linux-arm64 ./cmd/cann-ebpf
          cd dist
          sha256sum cann-ebpf-linux-arm64 > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cann-ebpf-linux-arm64
          path: |
            dist/cann-ebpf-linux-arm64
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cann-ebpf-linux-arm64
            dist/SHA256SUMS.txt
          generate_release_notes: true
